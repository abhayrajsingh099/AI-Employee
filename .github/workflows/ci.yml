
name: Django CI

on:
  push:
    branches:
      - main

jobs:
  django-test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      ENV_FILE: ""
      SECRET_KEY: "temporary-ci-secret-key"
      DEBUG: "False"

      DB_NAME: django_test_db
      DB_USER: root
      DB_PASSWORD: ci_mysql_password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_mysql_password
          MYSQL_DATABASE: django_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_mysql_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest

      - name: Run linting
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .
